name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: make build-all build-wasm VERSION=${{ github.ref_name }}

      - name: Compute checksums
        working-directory: bin
        run: |
          sha256sum \
            emlang-linux-amd64 \
            emlang-darwin-amd64 \
            emlang-darwin-arm64 \
            emlang-windows-amd64.exe \
            emlang.wasm > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            bin/emlang-linux-amd64 \
            bin/emlang-darwin-amd64 \
            bin/emlang-darwin-arm64 \
            bin/emlang-windows-amd64.exe \
            bin/emlang.wasm \
            bin/SHA256SUMS \
            --generate-notes
