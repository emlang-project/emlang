name: docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          make build-wasm
          mkdir public
          cp -r docs/. public/
          cp bin/emlang.wasm bin/wasm_exec.js public/
          echo "Generated from https://github.com/emlang-project/emlang/tree/main/docs. Do not edit by hand." > public/README.md

      - name: Publish to emlang-project/emlang-project.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: emlang-project/emlang-project.github.io
          publish_branch: main
          publish_dir: ./public
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
